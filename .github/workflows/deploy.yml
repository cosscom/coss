name: Deploy

# Production deploys (README, "Deploying to AWS"): builds the seven images, migrates once the Bun
# images are built (while the Next.js apps still build), rolls out all seven services at once and
# invalidates the coss.com CDN. Jobs that touch AWS run on CodeBuild-hosted
# runners whose role holds the credentials (infra/terraform/deploy.tf); nothing AWS-related is stored
# in GitHub. Pushes to main ship in batches (the `gate` job); run it by hand to deploy main at once,
# to redeploy (e.g. after a Terraform environment change) or, with `image_tag`, to roll back to an
# earlier commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit whose images to deploy (already built, e.g. a rollback). Empty builds this run's commit.
        required: false
        default: ""
# A redeploy of an earlier commit names it (the admin console's deploys page reads it back:
# apps/web/src/lib/deploy-runs.ts). Anything else keeps GitHub's default name.
run-name: ${{ inputs.image_tag && format('Deploy {0}', inputs.image_tag) || '' }}

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  STAGE: production
  REGISTRY: 294417174674.dkr.ecr.us-east-2.amazonaws.com

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      # This file, from main, only (a dispatch picks a ref). The jobs on the CodeBuild runner also need the `production` environment, which only
      # allows main. Neither stops a different workflow named "Deploy" (README, "Deploying to AWS").
      - name: Refuse anything but main
        env:
          REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          if [ "$REF" != refs/heads/main ] || [ "$WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/deploy.yml@refs/heads/main" ]; then
            echo "Production deploys run only from main ($WORKFLOW_REF)." >&2
            exit 1
          fi
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes ship in batches, so a burst of merges costs one build and one rollout. A push waits here
  # (on GitHub's runners, free for this public repository; CodeBuild bills every minute) until main
  # has had no newer push for QUIET_MINUTES or production's last deploy is MAX_INTERVAL_MINUTES old
  # (so the first push after a quiet spell ships at once). It doesn't wait for CI: only the merge
  # queue lands commits on main (main's ruleset), and it checked this exact commit (ci.yml). A newer
  # push supersedes this run: its own run waits instead and ships this commit too. Dispatches don't
  # wait.
  gate:
    needs: prepare
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read # this run's own start (when it was pushed)
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.wait.outputs.deploy }}
    steps:
      - name: Wait for a quiet main
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          QUIET_MINUTES: 20
          MAX_INTERVAL_MINUTES: 60
        run: |
          pushed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.created_at | fromdate')"
          waiting=""
          while :; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$SHA" ]; then
              echo "::notice::Superseded by a newer commit on main, whose run deploys this one too."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Every job with the `production` environment records a deployment: the last one is
            # when production last started shipping.
            last="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=1" \
              --jq '.[0].created_at // empty | fromdate')"
            now="$(date +%s)"
            quiet=$(((now - pushed) / 60))
            since=$(((now - ${last:-0}) / 60))
            if [ "$quiet" -ge "$QUIET_MINUTES" ] || [ "$since" -ge "$MAX_INTERVAL_MINUTES" ]; then
              echo "Main quiet for ${quiet} min, last deploy ${since} min ago: deploying."
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$waiting" ]; then
              echo "Waiting for ${QUIET_MINUTES} quiet minutes or ${MAX_INTERVAL_MINUTES} since the last deploy (now ${quiet} and ${since})."
              waiting=1
            fi
            # GITHUB_TOKEN gets 1,000 API requests an hour per repository.
            sleep 60
          done

  # The Next.js apps, one job each. The Bun images are `build-services`, which migrating waits for.
  build:
    needs: [prepare, gate]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build == 'true' &&
      (needs.gate.result == 'skipped' || (needs.gate.result == 'success' && needs.gate.outputs.deploy == 'true'))
    environment: production
    runs-on: codebuild-coss-production-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        images: [web, site, portal, sign]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Build and push ${{ matrix.images }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          # Uploads the Next.js apps' source maps to Sentry (a BuildKit secret, never in a layer).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: infra/scripts/build-images.sh ${{ matrix.images }}

  # The Bun images take seconds to build and CodeBuild bills each job by the started minute, so they
  # share one job. Named like the matrix's jobs (the admin console's deploys page reads `build (…)`).
  build-services:
    name: build (api worker smtp)
    needs: [prepare, gate]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build == 'true' &&
      (needs.gate.result == 'skipped' || (needs.gate.result == 'success' && needs.gate.outputs.deploy == 'true'))
    environment: production
    runs-on: codebuild-coss-production-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Build and push api worker smtp
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: infra/scripts/build-images.sh api worker smtp

  # As soon as the worker's image exists, while the Next.js apps still build:
  # migrations must be backward compatible with the running code anyway, so the commit's
  # migrations may land before its code (a failed build later leaves them unused, never broken).
  migrate:
    needs: [prepare, gate, build-services]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.build-services.result == 'success' || needs.build-services.result == 'skipped') &&
      (needs.gate.result == 'skipped' || (needs.gate.result == 'success' && needs.gate.outputs.deploy == 'true'))
    # Never two migrations at once.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    environment: production
    runs-on: codebuild-coss-production-deploy-${{ github.run_id }}-${{ github.run_attempt }}-arm-3.0-small
    timeout-minutes: 30
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check production doesn't run a newer commit
        id: latest
        env:
          EVENT: ${{ github.event_name }}
        run: infra/scripts/newer-deployed.sh
      - name: Migrate
        if: steps.latest.outputs.deploy == 'true'
        run: infra/scripts/ecs-task.sh --image-tag "$TAG" worker -- bun packages/db/src/migrate.ts

  deploy:
    needs: [prepare, gate, build, build-services, migrate]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.migrate.result == 'success' &&
      (needs.gate.result == 'skipped' || (needs.gate.result == 'success' && needs.gate.outputs.deploy == 'true'))
    # Never two rollouts at once (builds and another run's migration may overlap).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    # This job only drives the AWS CLI and waits on ECS: the smallest instance (the label overrides
    # the project's large one, which the image builds need).
    runs-on: codebuild-coss-production-deploy-${{ github.run_id }}-${{ github.run_attempt }}-arm-3.0-small
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # This job may have waited for another run's (infra/scripts/newer-deployed.sh).
      - name: Check production doesn't run a newer commit
        id: latest
        env:
          EVENT: ${{ github.event_name }}
        run: infra/scripts/newer-deployed.sh
      - name: Roll out
        if: steps.latest.outputs.deploy == 'true'
        run: infra/scripts/ecs-deploy.sh "$TAG" api worker web site portal sign smtp
      - name: Record the deployed commit
        if: steps.latest.outputs.deploy == 'true'
        run: aws ssm put-parameter --name "/coss/$STAGE/image-tag" --value "$TAG" --overwrite >/dev/null
      # Docs pages are cached for a year at the edge. Only our apps' cached paths, never the hashed
      # assets: tabs opened before this deploy still load their old chunks from the cache.
      - name: Invalidate the coss.com CDN
        if: steps.latest.outputs.deploy == 'true'
        env:
          DISTRIBUTION_ID: ${{ vars.DASHBOARD_DISTRIBUTION_ID }}
        run: |
          mapfile -t paths < <(jq -r '.cloudFront.invalidateAfterDeploy[]' infra/terraform/spec.json)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "${paths[@]}" --query Invalidation.Id --output text
      # Last, so the code ships either way: routing (ALB rules, CloudFront behaviours) only changes
      # with `terraform apply`, and a route that was never applied fails this job until it is.
      - name: Check routing against the spec
        if: steps.latest.outputs.deploy == 'true'
        env:
          DISTRIBUTION_ID: ${{ vars.DASHBOARD_DISTRIBUTION_ID }}
        run: infra/scripts/check-routing.sh
