name: Deploy

# Production deploys (README, "Deploying to AWS"): builds the four images while CI runs, then, once
# CI passed, migrates, rolls out all four services at once and invalidates the coss.com CDN. Jobs
# that touch AWS run on CodeBuild-hosted runners whose role holds the credentials
# (infra/terraform/deploy.tf); nothing AWS-related is stored in GitHub. Runs on every push to main;
# run it by hand to redeploy (e.g. after a Terraform environment change) or, with `image_tag`, to
# roll back to an earlier commit. If CI fails and a re-run passes, re-run this run's failed jobs.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit whose images to deploy (already built, e.g. a rollback). Empty builds this run's commit.
        required: false
        default: ""

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  STAGE: production
  REGISTRY: 294417174674.dkr.ecr.us-east-2.amazonaws.com

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      # This file, from main, only (a dispatch picks a ref). The jobs on the CodeBuild runner also need the `production` environment, which only
      # allows main. Neither stops a different workflow named "Deploy" (README, "Deploying to AWS").
      - name: Refuse anything but main
        env:
          REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          if [ "$REF" != refs/heads/main ] || [ "$WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/deploy.yml@refs/heads/main" ]; then
            echo "Production deploys run only from main ($WORKFLOW_REF)." >&2
            exit 1
          fi
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    environment: production
    runs-on: codebuild-coss-production-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        service: [web, site, api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # Builds start with CI instead of after it; nothing ships until the `ci` job below passes.
      - name: Build and push ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ needs.prepare.outputs.tag }}
          # Uploads the Next.js apps' source maps to Sentry (a BuildKit secret, never in a layer).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          image="$REGISTRY/coss/$SERVICE"
          if aws ecr describe-images --repository-name "coss/$SERVICE" --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "$image:$TAG already exists"
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          case "$SERVICE" in
            web | site) release_arg="NEXT_DEPLOYMENT_ID=$TAG" ;;
            *) release_arg="SENTRY_RELEASE=$TAG" ;;
          esac
          # Only the dependency layers are reusable (the build layer depends on the commit), so the
          # layer cache is keyed by what they're built from and exported only when that changes:
          # exporting it took longer than the build itself.
          deps="$({ cat bun.lock "apps/$SERVICE/Dockerfile"; git ls-files -z '*package.json' | xargs -0 cat; } | sha256sum | cut -c1-16)"
          cache="$image:buildcache-$deps"
          cache_to=()
          if ! aws ecr describe-images --repository-name "coss/$SERVICE" --image-ids "imageTag=buildcache-$deps" >/dev/null 2>&1; then
            cache_to=(--cache-to "type=registry,ref=$cache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true")
          fi
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build . \
            --file "apps/$SERVICE/Dockerfile" \
            --platform linux/arm64 \
            --build-arg "$release_arg" \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --cache-from "type=registry,ref=$cache" \
            "${cache_to[@]}" \
            --provenance=false \
            --tag "$image:$TAG" \
            --push

  # Waits for this commit's CI run (pushes only: a dispatch deploys what it's given).
  ci:
    needs: prepare
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          while :; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')"
            read -r status conclusion url <<<"$run"
            if [ "${status:-}" = completed ]; then
              [ "$conclusion" = success ] && { echo "CI passed: $url"; exit 0; }
              echo "CI $conclusion: $url — re-run it, then re-run this run's failed jobs." >&2
              exit 1
            fi
            sleep 10
          done

  deploy:
    needs: [prepare, build, ci]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    # Never two migrations or rollouts at once (builds may overlap).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    runs-on: codebuild-coss-production-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Migrations must be backward compatible with the running code; never two at once (the
      # job's concurrency group).
      - name: Migrate
        run: infra/scripts/ecs-task.sh --image-tag "$TAG" worker -- bun packages/db/src/migrate.ts
      # All at once: every rollout keeps old and new tasks side by side anyway, so ordering them
      # bought no compatibility, only time.
      - name: Roll out
        run: infra/scripts/ecs-deploy.sh "$TAG" api worker web site
      - name: Record the deployed commit
        run: aws ssm put-parameter --name "/coss/$STAGE/image-tag" --value "$TAG" --overwrite >/dev/null
      # Docs pages are cached for a year at the edge. Only our apps' cached paths, never the hashed
      # assets: tabs opened before this deploy still load their old chunks from the cache.
      - name: Invalidate the coss.com CDN
        env:
          DISTRIBUTION_ID: ${{ vars.DASHBOARD_DISTRIBUTION_ID }}
        run: |
          mapfile -t paths < <(jq -r '.cloudFront.invalidateAfterDeploy[]' infra/terraform/spec.json)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "${paths[@]}" --query Invalidation.Id --output text
      # Last, so the code ships either way: routing (ALB rules, CloudFront behaviours) only changes
      # with `terraform apply`, and a route that was never applied fails this job until it is.
      - name: Check routing against the spec
        env:
          DISTRIBUTION_ID: ${{ vars.DASHBOARD_DISTRIBUTION_ID }}
        run: infra/scripts/check-routing.sh
