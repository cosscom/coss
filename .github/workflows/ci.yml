name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI-only values. No .env file exists in CI; turbo passes these via globalEnv.
env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/coss_test
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coss_test
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  BETTER_AUTH_URL: http://localhost:3000
  API_PUBLIC_URL: http://localhost:3001
  API_PORT: "3001"
  EMAIL_PROVIDER: fake
  WEBHOOK_SECRETS_KEY: Y2ktb25seS13ZWJob29rLXNlY3JldHMta2V5LTMyYnk=
  TEST_VALKEY_URL: redis://localhost:6379
  # Every run saves the whole restored turbo cache again; drop entries no run has used for a week.
  TURBO_CACHE_MAX_AGE: 7d

# check, test and build run in parallel. Each restores the turbo cache its last run saved (keyed per
# job, so they never race for one key): tasks whose inputs didn't change are replayed. Tests are
# never cached (turbo.json).
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: turbo-check-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Only the SDK build the tests depend on is cacheable here.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The check job typechecks both Next apps; `next build` skips its own copy of that check.
      SKIP_BUILD_TYPECHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      # Turbopack's build cache (.next/cache/turbopack): builds start warm when an app's turbo
      # task misses. Reset whenever dependencies change, so it doesn't grow forever.
      - uses: actions/cache@v6
        with:
          path: |
            apps/web/.next/cache
            apps/site/.next/cache
          key: next-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run build

  # SDK changes (packages/sdk/src, except generated version.ts) need a changeset:
  # `bun run changeset`, or `bun run changeset --empty`
  # when nothing user-facing changed. Everything else in the repo is private and never versioned.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/${{ github.base_ref }}
