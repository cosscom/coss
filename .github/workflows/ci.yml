name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI-only values. No .env file exists in CI; turbo passes these via globalEnv.
env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/coss_test
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coss_test
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  BETTER_AUTH_URL: http://localhost:3000
  API_PUBLIC_URL: http://localhost:3001
  PORTAL_PUBLIC_URL: http://localhost:3003
  API_PORT: "3001"
  EMAIL_PROVIDER: fake
  WEBHOOK_SECRETS_KEY: Y2ktb25seS13ZWJob29rLXNlY3JldHMta2V5LTMyYnk=
  TEST_VALKEY_URL: redis://localhost:6379

# check, test and build run in parallel. Tests are never cached (turbo.json).
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pull-request code never receives remote-cache credentials. Protected main pushes populate
    # the shared signed cache after review.
    env:
      TURBO_TOKEN: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event_name == 'push' && vars.TURBO_TEAM || '' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ github.event_name == 'push' && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY || '' }}
    steps:
      # The pushed commit, not GitHub's merge with main: that's what people typecheck and build
      # locally, so the remote cache replays their results. Tests still run on the merge, and
      # main's own run catches what only breaks once merged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The check job typechecks both Next apps; `next build` skips its own copy of that check.
      SKIP_BUILD_TYPECHECK: "1"
      TURBO_TOKEN: ${{ github.event_name == 'push' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ github.event_name == 'push' && vars.TURBO_TEAM || '' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ github.event_name == 'push' && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY || '' }}
    steps:
      # The pushed commit, like the check job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Turbopack's build cache (.next/cache/turbopack): builds start warm when an app's turbo
      # task misses. Reset whenever dependencies change, so it doesn't grow forever.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/web/.next/cache
            apps/site/.next/cache
          key: next-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run build

  # The framework drivers (integrations/*: not workspaces, so turbo never runs them): lint and
  # tests against the newest and the oldest framework each supports, plus, on the newest, an
  # end-to-end run against the API's test app (`apps/api/test/serve.ts`) on this job's Postgres.
  integrations:
    name: integrations (${{ matrix.driver }}, ${{ matrix.versions }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: laravel, versions: "PHP 8.5, latest", php: "8.5", e2e: true, lint: true }
          - { driver: laravel, versions: "PHP 8.2, lowest", php: "8.2", composer: "--prefer-lowest" }
          - { driver: rails, versions: "Ruby 3.4, Rails 8.1", ruby: "3.4", rails: "8.1", e2e: true }
          - { driver: rails, versions: "Ruby 3.2, Rails 7.2", ruby: "3.2", rails: "7.2" }
          - { driver: django, versions: "Python 3.14, Django 6.1", python: "3.14", django: "django>=6.1,<6.2", e2e: true }
          - { driver: django, versions: "Python 3.10, Django 5.2", python: "3.10", django: "django>=5.2,<5.3" }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The API's test app, for the end-to-end tests: COSS_E2E is the line serve.ts prints.
      - if: matrix.e2e
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - if: matrix.e2e
        run: |
          bun install --frozen-lockfile
          bun run db:migrate:test
          bun run --cwd apps/api serve:test > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 60); do
            line="$(grep -m1 '^{"base_url"' "$RUNNER_TEMP/serve.log" || true)"
            if [ -n "$line" ]; then
              echo "COSS_E2E=$line" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"
          exit 1

      - if: matrix.driver == 'laravel'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - if: matrix.driver == 'laravel'
        working-directory: integrations/laravel
        run: |
          composer update --no-interaction --no-progress --prefer-stable ${{ matrix.composer }}
          # Pint's rules change between versions, so only the newest dependencies lint.
          if [ "${{ matrix.lint }}" = "true" ]; then composer lint; fi
          composer test

      - if: matrix.driver == 'rails'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: integrations/rails
      - if: matrix.driver == 'rails'
        working-directory: integrations/rails
        run: |
          bundle exec rubocop
          bundle exec rake test
          gem build coss-rails.gemspec

      - if: matrix.driver == 'django'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          # The default globs (**/pyproject.toml, …) walk node_modules after `bun install` and
          # never finish.
          cache-dependency-glob: integrations/django/uv.lock
      - if: matrix.driver == 'django'
        working-directory: integrations/django
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run --with "${{ matrix.django }}" pytest
          uv build
          uvx twine check dist/*

  # The generated SDKs (sdks/*: not workspaces, so turbo never runs them): each one's tests (its
  # generated ones and our own: the webhook and HTTP conformance, sdks/AGENTS.md) on the oldest
  # and newest runtime it supports, plus, on the newest, the end-to-end tests against the API's
  # test app. Regenerating them needs Docker and runs on main (sdks-regenerate.yml), not here.
  sdks:
    name: sdks (${{ matrix.sdk }}, ${{ matrix.versions }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sdk: python, versions: "Python 3.14", python: "3.14", e2e: true }
          - { sdk: python, versions: "Python 3.10", python: "3.10" }
          - { sdk: go, versions: "Go stable", go: "stable", e2e: true }
          - { sdk: go, versions: "Go 1.21", go: "1.21" }
          - { sdk: ruby, versions: "Ruby 3.4", ruby: "3.4", e2e: true }
          - { sdk: ruby, versions: "Ruby 3.3", ruby: "3.3" }
          # PHPUnit 12 needs PHP 8.3; on 8.1 (the oldest supported) only the syntax check runs.
          - { sdk: php, versions: "PHP 8.5", php: "8.5", e2e: true }
          - { sdk: php, versions: "PHP 8.1", php: "8.1", syntax-only: true }
          # Gradle runs on 17+; the jar targets Java 8.
          - { sdk: java, versions: "Java 21", java: "21", e2e: true }
          - { sdk: java, versions: "Java 17", java: "17" }
          # The test project targets .NET 9; the package also builds for .NET Framework and Standard.
          - { sdk: dotnet, versions: ".NET 10", dotnet: "10.0.x", e2e: true }
          - { sdk: dotnet, versions: ".NET 9", dotnet: "9.0.x" }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sdks/${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The API's test app, for the end-to-end tests: COSS_E2E is the line serve.ts prints.
      - if: matrix.e2e
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - if: matrix.e2e
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run db:migrate:test
          bun run --cwd apps/api serve:test > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 60); do
            line="$(grep -m1 '^{"base_url"' "$RUNNER_TEMP/serve.log" || true)"
            if [ -n "$line" ]; then
              echo "COSS_E2E=$line" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"
          exit 1

      - if: matrix.sdk == 'python'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - if: matrix.sdk == 'python'
        run: |
          uv venv
          uv pip install -e . pytest pytest-asyncio
          uv run --no-project ruff check src/coss/webhooks.py tests/custom
          uv run --no-project pytest
          uv build

      - if: matrix.sdk == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: sdks/go/go.sum
      - if: matrix.sdk == 'go'
        run: |
          test -z "$(gofmt -l webhooks.go custom_*_test.go)"
          go vet ./...
          go test ./...

      - if: matrix.sdk == 'ruby'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: sdks/ruby
      - if: matrix.sdk == 'ruby'
        run: |
          bundle exec rubocop
          bundle exec rake test
          gem build coss.gemspec

      - if: matrix.sdk == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - if: matrix.sdk == 'php' && matrix.syntax-only
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - if: matrix.sdk == 'php' && !matrix.syntax-only
        run: |
          composer validate
          composer update --no-interaction --no-progress --prefer-stable
          composer build
          composer test

      - if: matrix.sdk == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - if: matrix.sdk == 'java'
        run: ./gradlew --no-daemon test publishMavenPublicationToBundleRepository

      - if: matrix.sdk == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - if: matrix.sdk == 'dotnet'
        env:
          # The test project targets .NET 9: run it on the newest runtime installed.
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet format whitespace src/Coss.Test/Coss.Test.csproj --verify-no-changes --include src/Coss/Webhooks.cs src/Coss.Test/Custom/
          dotnet test src/Coss.Test/Coss.Test.csproj
          dotnet pack src/Coss/Coss.csproj --configuration Release

  # Changes to the public packages' sources (packages/sdk/src, except generated version.ts,
  # packages/mcp/src and packages/cli/src) need a changeset: `bun run changeset`, or `bun run changeset --empty` when
  # nothing user-facing changed. Everything else in the repo is private and never versioned.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/${{ github.base_ref }}
