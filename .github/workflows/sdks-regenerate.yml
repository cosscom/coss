name: Regenerate SDKs

# Keeps a "Regenerate SDKs" pull request open while the generated SDKs (sdks/*) are behind the
# API: on every push to main that changes the OpenAPI document or the generator, it runs
# `bun run sdks:generate` (Fern's generators, in Docker) and, when anything changed, bumps the
# SDKs' minor version (sdks/VERSION, a CHANGELOG.md entry in each), generates again with it and
# opens or updates the PR. Merging the PR releases the SDKs (release-sdks.yml). API pull
# requests never need Docker: their SDK changes arrive through this PR.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/openapi.json"
      - "tooling/sdkgen/**"
      - "sdks/fern/**"
      - ".github/workflows/sdks-regenerate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdks-regenerate
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run sdks:generate
      - id: changes
        run: |
          if [ -n "$(git status --porcelain -- sdks tooling/sdkgen/snippets.json)" ]; then
            git status --short -- sdks tooling/sdkgen/snippets.json | head -50
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The version is part of the generated code (User-Agent, package files): bump, then
      # generate again.
      - if: steps.changes.outputs.changed == 'true'
        id: bump
        run: |
          echo "version=$(bun run --cwd tooling/sdkgen bump --commit "$GITHUB_SHA" | tail -1)" >> "$GITHUB_OUTPUT"
          bun run sdks:generate
      - if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Pull requests opened with the default GITHUB_TOKEN don't trigger CI (see release.yml).
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          branch: sdks/regenerate
          title: Regenerate SDKs (${{ steps.bump.outputs.version }})
          commit-message: Regenerate SDKs (${{ steps.bump.outputs.version }})
          add-paths: |
            sdks
            tooling/sdkgen/snippets.json
          body: |
            `bun run sdks:generate` against main (${{ github.sha }}), as version ${{ steps.bump.outputs.version }} of every SDK in `sdks/`.

            Review the generated diff, and edit the CHANGELOG.md entries if the change deserves more than a regeneration note. Merging publishes the SDKs (`release-sdks.yml`).
