name: Release

# Keeps a "Version packages" PR open while changesets are pending on main; merging it bumps the SDK's
# version and CHANGELOG, and the push that merge makes publishes `coss` to npm. Publishing uses npm
# trusted publishing (GitHub's OIDC token, no npm token stored anywhere) with provenance, and only
# from this file, in the `npm` environment (deployable from main only): `npm trust list coss` shows
# the relationship (README, "Releasing the SDK").

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # true when no changeset is pending: main holds a version that may not be on npm yet.
      release: ${{ steps.changesets.outputs.has-changesets == 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Changesets 3 runs on Node (^22.11 || ^24 || >=26).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Also syncs packages/sdk/src/version.ts and bun.lock with the bumped version.
          version-script: bun run version-packages
          pr-title: Version packages
          commit-message: Version packages
          # Pull requests opened with the default GITHUB_TOKEN don't trigger CI. A GitHub App or
          # fine-grained token with contents + pull-requests write fixes that; it falls back to the
          # default token (the PR then needs CI started by hand, e.g. by pushing to it).
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}

  publish:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm trusts this workflow only in this environment, whose deployment branch policy allows main.
    environment: npm
    permissions:
      contents: write # the release's git tag
      id-token: write # npm trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      # The SDK (tsdown, publint, attw), published by npm itself so its output is in the log. A
      # version already on npm is skipped, so reruns are safe. A new version takes a minute or two
      # to show up in the registry: the job waits for it, so it only passes once it's really there.
      - name: Publish coss
        working-directory: packages/sdk
        run: |
          version="$(jq -r .version package.json)"
          if npm view "coss@$version" version >/dev/null 2>&1; then
            echo "coss@$version is already on npm."
            exit 0
          fi
          bun run build
          npm publish --provenance --access public
          for _ in $(seq 30); do
            npm view "coss@$version" version >/dev/null 2>&1 && break
            sleep 5
          done
          npm view "coss@$version" version dist.attestations.provenance.predicateType
          git tag "coss@$version"
          git push origin "coss@$version"
