name: Release

# Keeps a "Version packages" PR open while changesets are pending on main; merging it bumps the
# public packages' versions and CHANGELOGs (the SDK, `coss`, the MCP server, `coss-mcp`, and the
# CLI, `coss-cli`), and the push that merge makes publishes them to npm. Publishing uses npm trusted
# publishing (GitHub's OIDC token, no npm token stored anywhere) with provenance, and only from this
# file, in the `npm` environment (deployable from main only): `npm trust list coss` (and `coss-mcp`,
# `coss-cli`) show the relationship (README, "Releasing the SDK"). After that, the cli-* jobs
# attach the CLI's standalone executables to its GitHub release and update its Homebrew formula,
# once the CLI_BINARIES_PUBLISH variable is `true` (below).
#
# Run by hand (Actions → Release → Run workflow, on main: `gh workflow run release.yml`), it is a
# dry run of the CLI's executables instead: built from main, macOS ones signed and notarized,
# smoke-tested, and published nowhere (no npm, no GitHub release, no Homebrew). That checks the
# `apple` environment's certificate and notary key without waiting for a release.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Dry runs apart: a pending one must never take the place of a pending release.
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # true when no changeset is pending: main holds a version that may not be on npm yet.
      release: ${{ steps.changesets.outputs.has-changesets == 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Changesets 3 runs on Node (^22.11 || ^24 || >=26).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Also syncs packages/sdk/src/version.ts and bun.lock with the bumped version.
          version-script: bun run version-packages
          pr-title: Version packages
          commit-message: Version packages
          # Pull requests opened with the default GITHUB_TOKEN don't trigger CI. A GitHub App or
          # fine-grained token with contents + pull-requests write fixes that; it falls back to the
          # default token (the PR then needs CI started by hand, e.g. by pushing to it).
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}

  publish:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Each package may wait up to 15 minutes for the registry (below).
    timeout-minutes: 50
    # npm trusts this workflow only in this environment, whose deployment branch policy allows main.
    environment: npm
    permissions:
      contents: write # the release's git tag
      id-token: write # npm trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      # The SDK (tsdown, publint, attw), published by npm itself so its output is in the log. A
      # version already on npm is skipped, so reruns are safe. A new version usually takes a minute
      # or two to show up in the registry, sometimes over ten (0.5.0 took 12): the job waits up to
      # 15 minutes for it, so it only passes once it's really there.
      - name: Publish coss
        working-directory: packages/sdk
        run: |
          version="$(jq -r .version package.json)"
          if npm view "coss@$version" version >/dev/null 2>&1; then
            echo "coss@$version is already on npm."
            exit 0
          fi
          bun run build
          npm publish --provenance --access public
          for _ in $(seq 180); do
            npm view "coss@$version" version >/dev/null 2>&1 && break
            sleep 5
          done
          npm view "coss@$version" version dist.attestations.provenance.predicateType
          git tag "coss@$version"
          git push origin "coss@$version"
      # The MCP server, after the SDK: it depends on the `coss` version just published.
      - name: Publish coss-mcp
        working-directory: packages/mcp
        run: |
          version="$(jq -r .version package.json)"
          if npm view "coss-mcp@$version" version >/dev/null 2>&1; then
            echo "coss-mcp@$version is already on npm."
            exit 0
          fi
          bun run build
          npm publish --provenance --access public
          for _ in $(seq 180); do
            npm view "coss-mcp@$version" version >/dev/null 2>&1 && break
            sleep 5
          done
          npm view "coss-mcp@$version" version dist.attestations.provenance.predicateType
          git tag "coss-mcp@$version"
          git push origin "coss-mcp@$version"
      # After the SDK too, for the same reason.
      - name: Publish coss-cli
        working-directory: packages/cli
        run: |
          version="$(jq -r .version package.json)"
          if npm view "coss-cli@$version" version >/dev/null 2>&1; then
            echo "coss-cli@$version is already on npm."
            exit 0
          fi
          bun run build
          npm publish --provenance --access public
          for _ in $(seq 180); do
            npm view "coss-cli@$version" version >/dev/null 2>&1 && break
            sleep 5
          done
          npm view "coss-cli@$version" version dist.attestations.provenance.predicateType
          git tag "coss-cli@$version"
          git push origin "coss-cli@$version"

  # Standalone `coss` executables (packages/cli/scripts/binaries.ts) on the coss-cli@<version>
  # GitHub release, then the Homebrew formula in cosscom/homebrew-tap (`brew install
  # cosscom/tap/coss`). Every job is skipped until the repository variable CLI_BINARIES_PUBLISH is
  # `true` (AGENTS.md, "CLI binaries"). The check looks at the release itself, so a rerun, or the
  # first run after the variable is set, fills in whatever the current version is missing. Builds
  # come from the version's tag, never from a newer main (a dry run's from the commit it ran on).
  cli-binaries-check:
    needs: publish
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.publish.result == 'success' && vars.CLI_BINARIES_PUBLISH == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      ref: ${{ steps.check.outputs.ref }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          version="$(jq -r .version packages/cli/package.json)"
          tag="coss-cli@$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: building $GITHUB_SHA, publishing nothing."
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag isn't tagged: coss-cli $version isn't on npm yet."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif ! gh api "repos/$GITHUB_REPOSITORY/contents/packages/cli/scripts/binaries.ts?ref=$tag" --silent 2>/dev/null; then
            # Builds come from the tag: versions released before the binaries have no script.
            echo "$tag predates the standalone binaries: the next coss-cli version gets them."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then
            echo "The $tag release already has its binaries."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  cli-binaries-build:
    needs: cli-binaries-check
    # Explicit: a dry run's skipped version and publish jobs would otherwise skip this one, and
    # everything after it.
    if: >-
      !cancelled() && needs.cli-binaries-check.result == 'success' &&
      needs.cli-binaries-check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.cli-binaries-check.outputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The CLI bundles the workspace SDK's build, like the npm package depends on it.
      - run: bun run --cwd packages/sdk build
      # Every target, cross-compiled here (macOS ones come out ad-hoc signed).
      - run: bun run --cwd packages/cli build:binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: packages/cli/binaries/release
          if-no-files-found: error
          retention-days: 7

  # The macOS executables signed with coss.com's Developer ID certificate (hardened runtime) and
  # notarized by Apple (scripts/notarize.ts), then archived again with a new SHA256SUMS, so a copy
  # downloaded with a browser opens without Gatekeeper's warning. Skipped until the repository
  # variable CLI_MACOS_NOTARIZE is `true` (AGENTS.md, "CLI binaries"): releases then ship the
  # ad-hoc signed builds. A dry run always notarizes (that's what it is for).
  cli-binaries-notarize:
    needs: [cli-binaries-check, cli-binaries-build]
    if: >-
      !cancelled() && needs.cli-binaries-build.result == 'success' &&
      (vars.CLI_MACOS_NOTARIZE == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 45
    # Holds the Developer ID certificate and the App Store Connect API key notarytool uses.
    environment: apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.cli-binaries-check.outputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: release
      # A keychain of this job's own, with only the Developer ID identity, removed at the end.
      - name: Signing keychain and notary key
        env:
          DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" \
            "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          echo "APPLE_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
      - name: Sign, notarize and archive again
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bun packages/cli/scripts/notarize.ts release
      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"
      # Replaces the build's artifact: the smoke tests and the release take the notarized one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: release
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Each executable that a runner can run, run through scripts/smoke-binary.ts on its own OS
  # (and the musl ones in Alpine) before anything is published. darwin-x64 has no runner here.
  # They wait for notarization when it's on, and test the notarized builds.
  cli-binaries-smoke:
    needs: [cli-binaries-check, cli-binaries-build, cli-binaries-notarize]
    if: >-
      always() && needs.cli-binaries-build.result == 'success' &&
      (needs.cli-binaries-notarize.result == 'success' || needs.cli-binaries-notarize.result == 'skipped')
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux-x64, musl: linux-x64-musl }
          - { runner: ubuntu-24.04-arm, target: linux-arm64, musl: linux-arm64-musl }
          - { runner: macos-latest, target: darwin-arm64 }
          - { runner: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.cli-binaries-check.outputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: release
      # Git Bash's GNU tar can't read zips.
      - name: Extract (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        env:
          VERSION: ${{ needs.cli-binaries-check.outputs.version }}
        run: Expand-Archive -Path "release/coss-cli-$env:VERSION-windows-x64.zip" -DestinationPath smoke
      - name: Extract
        if: matrix.target != 'windows-x64'
        env:
          VERSION: ${{ needs.cli-binaries-check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p smoke
          tar -xzf "release/coss-cli-$VERSION-$TARGET.tar.gz" -C smoke
      - name: Smoke test
        shell: bash
        run: bun packages/cli/scripts/smoke-binary.ts "smoke/coss${{ matrix.target == 'windows-x64' && '.exe' || '' }}"
      # What a browser download is: quarantined. Only a notarized executable passes Gatekeeper then.
      # The runner's Gatekeeper may be off, so running it proves little on its own: codesign asks
      # Apple whether this exact signature is notarized (online: a bare executable has no stapled
      # ticket) and fails the job if not. spctl's verdict is printed for the log only.
      - name: Gatekeeper (macOS, notarized)
        if: matrix.target == 'darwin-arm64' && needs.cli-binaries-notarize.result == 'success'
        env:
          VERSION: ${{ needs.cli-binaries-check.outputs.version }}
        run: |
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" smoke/coss
          codesign --verify --strict --verbose=2 --check-notarization -R notarized smoke/coss
          spctl --status || true
          spctl --assess --type execute --verbose=2 smoke/coss || true
          smoke/coss --version | grep -qx "$VERSION"
      - name: Smoke test (musl, in Alpine)
        if: matrix.musl
        env:
          VERSION: ${{ needs.cli-binaries-check.outputs.version }}
          TARGET: ${{ matrix.musl }}
        run: |
          mkdir -p musl
          tar -xzf "release/coss-cli-$VERSION-$TARGET.tar.gz" -C musl
          # Bun's musl builds link libstdc++, which Alpine doesn't install by default.
          docker run --rm -v "$PWD/musl:/w:ro" alpine:3 sh -c 'apk add --no-cache -q libstdc++ &&
            /w/coss --version && /w/coss completion bash | grep -q "coss __complete"' |
            grep -qx "$VERSION"

  cli-binaries-release:
    needs: [cli-binaries-check, cli-binaries-smoke]
    # Explicit: a skipped cli-binaries-notarize upstream would otherwise skip this job too.
    if: >-
      always() && github.event_name == 'push' && needs.cli-binaries-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.cli-binaries-check.outputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.cli-binaries-check.outputs.tag }}
          VERSION: ${{ needs.cli-binaries-check.outputs.version }}
        run: |
          bun packages/cli/scripts/binaries.ts --notes > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            # Latest: install.sh and `releases/latest` find the CLI (the only package with
            # GitHub releases).
            gh release create "$TAG" release/* --verify-tag --latest \
              --title "coss-cli $VERSION" --notes-file notes.md
          fi

  # Runs after a new release, and whenever the check ran but there was nothing to build (a rerun
  # after a failed push): the formula is rendered from the release's own SHA256SUMS.
  cli-homebrew:
    needs: [cli-binaries-check, cli-binaries-release]
    if: >-
      always() && github.event_name == 'push' && needs.cli-binaries-check.result == 'success' &&
      (needs.cli-binaries-release.result == 'success' || needs.cli-binaries-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds HOMEBREW_TAP_DEPLOY_KEY (write access to cosscom/homebrew-tap only).
    environment: homebrew
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.cli-binaries-check.outputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cosscom/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Update Formula/coss.rb
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.cli-binaries-check.outputs.tag }}
          VERSION: ${{ needs.cli-binaries-check.outputs.version }}
        run: |
          if ! gh release download "$TAG" --pattern SHA256SUMS --dir . 2>/dev/null; then
            echo "The $TAG release has no binaries yet."
            exit 0
          fi
          mkdir -p tap/Formula
          bun packages/cli/scripts/homebrew.ts "$VERSION" SHA256SUMS > tap/Formula/coss.rb
          ruby -c tap/Formula/coss.rb
          cd tap
          git add Formula/coss.rb
          if git diff --cached --quiet; then
            echo "Formula/coss.rb is already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "coss $VERSION"
          git push
